[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-provider-anthropic"
version = "1.0.0"
description = "Anthropic Messages provider plugin for BanyanOS llm_engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ideabosque" },
]
dependencies = [
    "silvaengine_utility",
    "llm-provider-base>=1.0,<2",
    # 1.x moved to the httpx2 fork and rejects an injected httpx.Client
    # (plan D7 / §10) — pinned to the httpx-based 0.x line.
    "anthropic>=0.40,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.6",
]

[project.entry-points."banyan.llm_providers"]
anthropic = "llm_provider_anthropic:AnthropicProvider"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_provider_anthropic*"]

[tool.setuptools.package-data]
llm_provider_anthropic = ["*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
